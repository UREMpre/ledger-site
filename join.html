<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Money Laundering invite</title>
  <style>
    body { font: 17px -apple-system, system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f5f5f7; color: #1d1d1f; }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    a.button { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.4rem; border-radius: 999px; background: #1d1d1f; color: #fff; text-decoration: none; font-weight: 600; }
    p.small { font-size: 14px; color: #6e6e73; }
  </style>
</head>
<body>
  <main>
    <h1>Someone shared their Money Laundering setup with you</h1>
    <p>Open this link on an iPhone with Money Laundering installed. The app sets itself up from it.</p>
    <a id="open" class="button" href="#">Open in Money Laundering</a>
    <p class="small">Nothing from this link is sent to this website: the setup travels only in the part after the <code>#</code>, which stays on your phone.</p>
  </main>
  <script>
    // Same URL, fragment included; a plain anchor would drop nothing either, but this keeps the
    // button honest if the page is ever served under a different path.
    document.getElementById('open').href = location.href;
  </script>
</body>
</html>
